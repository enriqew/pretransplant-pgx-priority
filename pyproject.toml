[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pretransplant-pgx-priority"
version = "0.1.0"
description = "Pre-transplant genotyping priority scoring: gene × organ × population"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "requests>=2.31",
    "duckdb>=0.10",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "dbt-duckdb>=1.8",
    "ruff>=0.4",
]

[tool.hatch.build.targets.wheel]
packages = ["src/pretransplant_pgx"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
